name: Data correction
description: Report a wrong, missing or out-of-date number or fact.
title: "Data correction: "
labels: ["data"]
body:
  - type: input
    id: where
    attributes:
      label: Where is it?
      description: The state card, table, watchlist entry (for example C031) or source.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong, and what should it say?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Link to a public source that shows the correct figure
    validations:
      required: true
