name: Update state electricity data

on:
  schedule:
    - cron: "17 13 3 * *"   # 3rd of each month (EIA updates its bulk file monthly)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull latest EIA data (free bulk file, no key)
        id: pull
        run: |
          set +e
          python scripts/update_data.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then exit 1; fi
          exit 0
      - name: Open a pull request for review
        if: steps.pull.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="data-update-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/state_electricity.json
          git commit -m "Update state electricity data"
          git push -u origin "$branch"
          gh pr create --title "Update state electricity data" \
            --body "Automatic refresh from EIA's monthly state data (last 12 months). Checks passed (all 51 areas present, no value changed by more than 50%). Review the diff, then merge to publish." \
            --base main --head "$branch"
